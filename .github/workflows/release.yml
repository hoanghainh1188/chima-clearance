name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # e.g. v1.0.0, v1.2.3

permissions:
  contents: write   # needed to upload release assets via gh

jobs:
  build-installer:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Normalize line endings
        run: |
          git config --global core.autocrlf false
          git reset --hard HEAD

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # Same pattern as ci.yml: detect real SDK location, write to GITHUB_PATH + GITHUB_ENV.
      - name: Pin dotnet on PATH
        shell: bash
        run: |
          DOTNET_EXE="$(command -v dotnet)"
          DOTNET_BASH_DIR="$(dirname "${DOTNET_EXE}")"
          DOTNET_WIN_DIR="$(cygpath -w "${DOTNET_BASH_DIR}")"
          echo "${DOTNET_BASH_DIR}" >> "${GITHUB_PATH}"
          echo "DOTNET_ROOT=${DOTNET_WIN_DIR}" >> "${GITHUB_ENV}"
          dotnet --version

      - name: Install MAUI workload
        shell: bash
        run: dotnet workload install maui

      - name: Restore
        shell: bash
        run: |
          dotnet workload restore B2.sln
          dotnet restore B2.sln

      # Parse version from tag (strips leading 'v').
      - name: Set version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"          # e.g. v1.0.0
          VERSION="${TAG#v}"                # e.g. 1.0.0
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      # -----------------------------------------------------------------------
      # Publish all three binaries as SELF-CONTAINED win-x64 so the offline
      # customs PCs need NO .NET runtime install (they have no internet).
      #   - Service/Installer: -r win-x64 --self-contained true + PublishSingleFile.
      #   - Desktop (MAUI unpackaged): the .NET SDK forbids `--self-contained` here
      #     (NETSDK1134); the MAUI-correct switch is -p:WindowsAppSDKSelfContained=true,
      #     which bundles BOTH the .NET runtime and the Windows App SDK runtime
      #     (per Microsoft Learn "Publish an unpackaged .NET MAUI app for Windows").
      #     WITHOUT it the desktop is framework-dependent and will not start on a
      #     machine that lacks the runtime — unacceptable offline.
      # Publish each project individually to avoid MSB1008 on the Windows bash shell.
      # NOTE: even self-contained, MAUI still needs WebView2 Runtime + VC++ 2015–2022
      # x64 on the target; those are bundled below and installed offline (see
      # docs/deployment-offline.md).
      # -----------------------------------------------------------------------
      - name: Publish B2.Server.Service
        shell: bash
        run: |
          dotnet publish src/B2.Server.Service/B2.Server.Service.csproj \
            -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true \
            -p:Version="${VERSION}" \
            -p:ErrorOnDuplicatePublishOutputFiles=false \
            -o publish/service

      - name: Publish B2.Desktop
        shell: bash
        run: |
          dotnet publish src/B2.Desktop/B2.Desktop.csproj \
            -c Release -f net8.0-windows10.0.19041.0 \
            -p:RuntimeIdentifierOverride=win-x64 \
            -p:WindowsAppSDKSelfContained=true \
            -p:Version="${VERSION}" \
            -o publish/desktop

      - name: Publish B2.Installer (B2Clearance.exe)
        shell: bash
        run: |
          dotnet publish src/B2.Installer/B2.Installer.csproj \
            -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true \
            -p:Version="${VERSION}" \
            -o publish/installer

      # -----------------------------------------------------------------------
      # Assemble the offline xcopy payload (no update framework — see ADR-0007):
      #   publish/pkg/
      #     install.ps1 / uninstall.ps1 ← operator scripts (deploy/)
      #     B2Clearance.exe             ← standalone installer CLI (install|uninstall)
      #     B2.Server.Service.exe       ← Windows Service binary (self-contained)
      #     Desktop/                    ← Desktop app folder (self-contained)
      #     Templates/                  ← Sổ B2 Excel template
      #     litestream.exe              ← Continuous backup binary
      #     prereqs/                    ← VC++ redist (+ WebView2 added on USB)
      #     docs/                       ← install guide + runbook (operators are offline)
      # Shipped as a single .zip: extract on USB, run install.ps1 elevated on the gate PC.
      # -----------------------------------------------------------------------
      - name: Download Litestream
        shell: bash
        run: |
          # v0.5.11 is the first release with a Windows x86_64 binary.
          # Filename format: litestream-0.5.11-windows-x86_64.zip (no 'v' prefix, x86_64 not amd64)
          # SHA-256 pinned from the upstream release's checksums.txt — a swapped or corrupted
          # download fails the release instead of shipping to the offline gate PCs.
          LITESTREAM_TAG="v0.5.11"
          LITESTREAM_VER="0.5.11"
          LITESTREAM_SHA256="9116e8605d4b479e15044ccbccf2aa756be7a8a64b9237f67a074ec1742444a3"
          curl -fsSL \
            "https://github.com/benbjohnson/litestream/releases/download/${LITESTREAM_TAG}/litestream-${LITESTREAM_VER}-windows-x86_64.zip" \
            -o litestream.zip
          echo "${LITESTREAM_SHA256}  litestream.zip" | sha256sum -c -
          unzip -q litestream.zip -d litestream-bin
          cp litestream-bin/litestream.exe publish/installer/litestream.exe

      # Offline OS prerequisites that self-contained MAUI still needs on the target.
      # VC++ 2015–2022 x64 has a STABLE Microsoft link, so we bundle it. The WebView2
      # Evergreen *Standalone* (offline) installer has no stable direct URL — it is added
      # to the USB manually per docs/deployment-offline.md; we drop a placeholder note.
      - name: Bundle offline prerequisites
        shell: bash
        run: |
          mkdir -p publish/prereqs
          curl -fsSL "https://aka.ms/vs/17/release/vc_redist.x64.exe" -o publish/prereqs/vc_redist.x64.exe
          # Operator note in Vietnamese. UTF-8 BOM so Notepad on older Windows 10 shows the
          # diacritics correctly.
          {
            printf '\xEF\xBB\xBF'
            cat <<'EOF'
          Đặt bộ cài Microsoft Edge WebView2 Runtime vào thư mục này TRƯỚC khi chép sang máy
          cửa khẩu (máy không có internet).

          Tải trên máy có internet:
            https://developer.microsoft.com/microsoft-edge/webview2/
            -> Evergreen Standalone Installer -> x64
          Tên file dạng: MicrosoftEdgeWebView2RuntimeInstallerX64.exe

          install.ps1 tự cài vc_redist.x64.exe rồi đến WebView2.
          Xem hướng dẫn đầy đủ: docs\huong-dan-cai-dat.md (ở thư mục gốc gói cài).
          EOF
          } > publish/prereqs/README-WebView2.txt

      # vc_redist comes from a moving aka.ms link (always the latest build), so a hash
      # cannot be pinned — verify the Authenticode signature is valid and Microsoft's instead.
      - name: Verify VC++ redist signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature -FilePath 'publish/prereqs/vc_redist.x64.exe'
          if ($sig.Status -ne 'Valid') { throw "vc_redist.x64.exe signature status: $($sig.Status)" }
          if ($sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw "vc_redist.x64.exe signed by unexpected subject: $($sig.SignerCertificate.Subject)"
          }
          Write-Host "vc_redist.x64.exe signed by: $($sig.SignerCertificate.Subject)"

      - name: Assemble package dir
        shell: bash
        run: |
          mkdir -p publish/pkg
          # Installer CLI (B2Clearance.exe) + litestream.exe + Templates/
          cp -r publish/installer/. publish/pkg/
          # Service (self-contained single-file)
          cp -r publish/service/. publish/pkg/
          # Desktop (self-contained) into a subdirectory so it doesn't clash with service files
          mkdir -p publish/pkg/Desktop
          cp -r publish/desktop/. publish/pkg/Desktop/
          # Offline prerequisites (VC++ redist + WebView2 placeholder)
          mkdir -p publish/pkg/prereqs
          cp -r publish/prereqs/. publish/pkg/prereqs/
          # Operator scripts at payload root
          cp deploy/install.ps1 deploy/uninstall.ps1 publish/pkg/
          # Operator docs — gate PCs are offline, so the guide must travel inside the zip.
          # Same relative layout as the repo so links between the docs keep working;
          # install.ps1 copies docs\ into Program Files too, leaving the runbook on the PC.
          mkdir -p publish/pkg/docs
          cp docs/huong-dan-cai-dat.md docs/runbook.md docs/deployment-offline.md publish/pkg/docs/

      # -----------------------------------------------------------------------
      # Ship the payload as a single offline .zip. No installer framework, no
      # update feed — extract on USB, run install.ps1 elevated on the gate PC.
      # -----------------------------------------------------------------------
      - name: Zip offline package
        shell: bash
        run: |
          mkdir -p Releases
          ZIP="Releases/B2Clearance-${VERSION}-offline.zip"
          ( cd publish/pkg && 7z a -tzip "../../${ZIP}" ./* >/dev/null )
          ls -lh Releases/

      - name: Create GitHub Release
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Cài đặt offline

          1. Giải nén `B2Clearance-<phiên bản>-offline.zip`, bổ sung WebView2 Standalone x64 vào
             `prereqs\` (xem `prereqs\README-WebView2.txt`), chép sang USB.
          2. Mở **`docs\huong-dan-cai-dat.md`** trong gói cài và làm theo từng bước.
          3. PowerShell **Run as administrator**, trong thư mục gói cài:

          | Máy | Lệnh |
          | --- | --- |
          | Cổng vào (máy chủ) — cài trước | `.\install.ps1` |
          | Cổng ra (chỉ ứng dụng) | `.\install.ps1 -ClientOnly -ServerUrl <IP máy cổng vào>` |

          Nâng cấp: chạy lại đúng lệnh đã dùng khi cài; dữ liệu và mã phục hồi được giữ nguyên.
          Thay đổi chi tiết: `CHANGELOG.md`.
          EOF
          gh release create "${GITHUB_REF_NAME}" \
            --title "B2 Clearance ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            "Releases/B2Clearance-${VERSION}-offline.zip"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Redundant convenience copy — the release .zip is already attached to the GitHub
      # Release above (not subject to Actions artifact quota). Don't fail the release if
      # the artifact-storage quota is hit.
      - name: Upload offline package artifact
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: B2Clearance-${{ env.VERSION }}-offline
          path: Releases/
