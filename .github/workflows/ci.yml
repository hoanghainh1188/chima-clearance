name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Windows runners often use core.autocrlf=true; working tree CRLF fails dotnet format vs .editorconfig (LF).
      - name: Normalize line endings for format/build
        run: |
          git config --global core.autocrlf false
          git reset --hard HEAD

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # setup-dotnet@v5 intermittently fails to propagate the SDK location to
      # GITHUB_PATH on windows-2022, so a later bash step hits "Unable to locate
      # dotnet CLI. Ensure that it is on the PATH." (observed at "Verify
      # formatting" across PR #9 first run, R3b ×2, PR #40, PR #41 ×2). On the
      # hosted runner the SDK (and setup-dotnet's install) live at
      # C:\Program Files\dotnet, so pin that onto PATH + DOTNET_ROOT explicitly
      # for every subsequent step instead of relying on the action's own write.
      - name: Pin dotnet on PATH (setup-dotnet windows flake guard)
        shell: bash
        run: |
          echo "/c/Program Files/dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=C:\\Program Files\\dotnet" >> "$GITHUB_ENV"

      # Every dotnet step uses `shell: bash` (Git Bash): Git Bash reads PATH via
      # the runner's persistent env, which together with the pin step above keeps
      # the SDK reliably resolvable between steps.
      - name: Install MAUI workload
        shell: bash
        run: dotnet workload install maui

      # B2.Desktop declares <RuntimeIdentifiers>win-x64</RuntimeIdentifiers>
      # so restore pulls Microsoft.NETCore.App.Runtime.win-x64. Build/test stay
      # solution-level and framework-dependent (NETSDK1134 forbids -r at solution
      # build). The plural form is the documented way to make restore RID-aware
      # without forcing platform-specific build outputs.
      - name: Restore
        shell: bash
        run: |
          dotnet workload restore B2.sln
          dotnet restore B2.sln

      - name: Verify formatting (Constitution III)
        shell: bash
        run: dotnet format B2.sln --verify-no-changes --no-restore

      - name: Build (Release; TreatWarningsAsErrors=true)
        shell: bash
        run: dotnet build B2.sln -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Test (Release) with coverage
        shell: bash
        run: dotnet test B2.sln -c Release --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: '**/coverage.cobertura.xml'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/test-results.trx'

  gitleaks:
    # Official gitleaks/gitleaks-action@v2 requires GITLEAKS_LICENSE for org-owned
    # repos. The open-source gitleaks CLI (same engine) has no such requirement.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks (OSS CLI)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Detect secrets
        run: gitleaks detect --source . --verbose --redact

  no-maui-quick-check:
    # Cross-platform sanity check on the non-MAUI projects so feedback isn't
    # gated on the slower windows-2022 runner. Builds + tests B2.NoMaui.slnf
    # (everything except B2.Desktop) on ubuntu-latest.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore (no-MAUI subset)
        run: dotnet restore B2.NoMaui.slnf

      - name: Verify formatting
        run: dotnet format B2.NoMaui.slnf --verify-no-changes --no-restore

      - name: Build (Release; TreatWarningsAsErrors=true)
        run: dotnet build B2.NoMaui.slnf -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Test (Release)
        run: dotnet test B2.NoMaui.slnf -c Release --no-build
