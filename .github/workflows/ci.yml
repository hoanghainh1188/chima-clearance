name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 30
    # Static, job-level DOTNET_ROOT so every step resolves the SDK without depending on
    # setup-dotnet's GITHUB_ENV write (which intermittently failed to propagate, surfacing
    # as "Unable to locate dotnet CLI" at Verify formatting — PR #42's GITHUB_ENV-based
    # pin shared that flaky mechanism and still missed on PR #46). Job-level env is plain
    # YAML, always present.
    env:
      DOTNET_ROOT: 'C:\Program Files\dotnet'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Windows runners often use core.autocrlf=true; working tree CRLF fails dotnet format vs .editorconfig (LF).
      - name: Normalize line endings for format/build
        run: |
          git config --global core.autocrlf false
          git reset --hard HEAD

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # Diagnostic (always runs): if the muxer ever goes missing again this reveals the
      # real SDK location instead of just "Unable to locate dotnet CLI".
      - name: Locate .NET SDK
        shell: bash
        run: |
          echo "DOTNET_ROOT=$DOTNET_ROOT"
          command -v dotnet || echo "dotnet not found on PATH"
          ls -la "/c/Program Files/dotnet" || true

      # Every dotnet step prepends the SDK dir to PATH in its OWN shell. Git Bash spawns a
      # fresh shell per step, so this is immune to the setup-dotnet GITHUB_PATH/GITHUB_ENV
      # propagation race that produced "Unable to locate dotnet CLI" at Verify formatting
      # (PR #9 first run, R3b ×2, PR #40-#42, #46, #47). DOTNET_ROOT is the static
      # job-level env above. Defining a reusable env var keeps the prefix DRY.
      - name: Install MAUI workload
        shell: bash
        run: |
          export PATH="$DOTNET_DIR:$PATH"
          dotnet workload install maui
        env:
          DOTNET_DIR: '/c/Program Files/dotnet'

      # B2.Desktop declares <RuntimeIdentifiers>win-x64</RuntimeIdentifiers>
      # so restore pulls Microsoft.NETCore.App.Runtime.win-x64. Build/test stay
      # solution-level and framework-dependent (NETSDK1134 forbids -r at solution
      # build). The plural form is the documented way to make restore RID-aware
      # without forcing platform-specific build outputs.
      - name: Restore
        shell: bash
        run: |
          export PATH="$DOTNET_DIR:$PATH"
          dotnet workload restore B2.sln
          dotnet restore B2.sln
        env:
          DOTNET_DIR: '/c/Program Files/dotnet'

      - name: Verify formatting (Constitution III)
        shell: bash
        run: |
          export PATH="$DOTNET_DIR:$PATH"
          dotnet format B2.sln --verify-no-changes --no-restore
        env:
          DOTNET_DIR: '/c/Program Files/dotnet'

      - name: Build (Release; TreatWarningsAsErrors=true)
        shell: bash
        run: |
          export PATH="$DOTNET_DIR:$PATH"
          dotnet build B2.sln -c Release --no-restore -p:TreatWarningsAsErrors=true
        env:
          DOTNET_DIR: '/c/Program Files/dotnet'

      - name: Test (Release) with coverage
        shell: bash
        run: |
          export PATH="$DOTNET_DIR:$PATH"
          dotnet test B2.sln -c Release --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx"
        env:
          DOTNET_DIR: '/c/Program Files/dotnet'

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: '**/coverage.cobertura.xml'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/test-results.trx'

  gitleaks:
    # Official gitleaks/gitleaks-action@v2 requires GITLEAKS_LICENSE for org-owned
    # repos. The open-source gitleaks CLI (same engine) has no such requirement.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks (OSS CLI)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Detect secrets
        run: gitleaks detect --source . --verbose --redact

  no-maui-quick-check:
    # Cross-platform sanity check on the non-MAUI projects so feedback isn't
    # gated on the slower windows-2022 runner. Builds + tests B2.NoMaui.slnf
    # (everything except B2.Desktop) on ubuntu-latest.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore (no-MAUI subset)
        run: dotnet restore B2.NoMaui.slnf

      - name: Verify formatting
        run: dotnet format B2.NoMaui.slnf --verify-no-changes --no-restore

      - name: Build (Release; TreatWarningsAsErrors=true)
        run: dotnet build B2.NoMaui.slnf -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Test (Release)
        run: dotnet test B2.NoMaui.slnf -c Release --no-build
