name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 30
    # NOTE: No job-level DOTNET_ROOT hardcode here.
    # setup-dotnet@v5 installs the SDK to hostedtoolcache (not necessarily
    # C:\Program Files\dotnet) and writes the real path via $GITHUB_ENV.
    # A hardcoded fallback here masked that write when it succeeded, and pointed
    # to the wrong location when it failed — both paths lead to
    # "Unable to locate dotnet CLI" in MSBuild child processes.
    # The "Pin dotnet on PATH" step below handles discovery robustly.

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Windows runners often use core.autocrlf=true; working tree CRLF fails
      # dotnet format vs .editorconfig (LF).
      - name: Normalize line endings for format/build
        run: |
          git config --global core.autocrlf false
          git reset --hard HEAD

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # Detect where setup-dotnet actually placed the SDK (hostedtoolcache path
      # varies by run), then publish it to GITHUB_PATH + GITHUB_ENV so every
      # subsequent step sees it without per-step PATH exports or hardcoded dirs.
      #
      # Two writes, belt-and-suspenders:
      #   GITHUB_PATH → adds the dir to PATH for all later steps (bash lookup)
      #   GITHUB_ENV  → sets DOTNET_ROOT so MSBuild child processes find the SDK
      #
      # Replaces the old "Locate .NET SDK" diagnostic + per-step
      # `export PATH="$DOTNET_DIR:$PATH"` / `env: DOTNET_DIR:` pattern which
      # hardcoded /c/Program Files/dotnet and broke whenever setup-dotnet used
      # a different install path (PR #9, R3b ×2, #40–#42, #46–#47, #61).
      - name: Pin dotnet on PATH
        shell: bash
        run: |
          DOTNET_EXE="$(command -v dotnet)"
          DOTNET_BASH_DIR="$(dirname "${DOTNET_EXE}")"
          DOTNET_WIN_DIR="$(cygpath -w "${DOTNET_BASH_DIR}")"
          echo "dotnet binary   : ${DOTNET_EXE}"
          echo "POSIX SDK dir   : ${DOTNET_BASH_DIR}"
          echo "Windows SDK dir : ${DOTNET_WIN_DIR}"
          echo "${DOTNET_BASH_DIR}" >> "${GITHUB_PATH}"
          echo "DOTNET_ROOT=${DOTNET_WIN_DIR}" >> "${GITHUB_ENV}"
          dotnet --version

      # B2.Desktop declares <RuntimeIdentifiers>win-x64</RuntimeIdentifiers>
      # so restore pulls Microsoft.NETCore.App.Runtime.win-x64. Build/test stay
      # solution-level and framework-dependent (NETSDK1134 forbids -r at solution
      # build). The plural form is the documented way to make restore RID-aware
      # without forcing platform-specific build outputs.
      - name: Install MAUI workload
        shell: bash
        run: dotnet workload install maui

      - name: Restore
        shell: bash
        run: |
          dotnet workload restore B2.sln
          dotnet restore B2.sln

      - name: Verify formatting (Constitution III)
        shell: bash
        run: dotnet format B2.sln --verify-no-changes --no-restore

      - name: Build (Release; TreatWarningsAsErrors=true)
        shell: bash
        run: dotnet build B2.sln -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Test (Release) with coverage
        shell: bash
        run: dotnet test B2.sln -c Release --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: '**/coverage.cobertura.xml'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/test-results.trx'

  gitleaks:
    # Official gitleaks/gitleaks-action@v2 requires GITLEAKS_LICENSE for org-owned
    # repos. The open-source gitleaks CLI (same engine) has no such requirement.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks (OSS CLI)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Detect secrets
        run: gitleaks detect --source . --verbose --redact

  no-maui-quick-check:
    # Cross-platform sanity check on the non-MAUI projects so feedback isn't
    # gated on the slower windows-2022 runner. Builds + tests B2.NoMaui.slnf
    # (everything except B2.Desktop) on ubuntu-latest.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore (no-MAUI subset)
        run: dotnet restore B2.NoMaui.slnf

      - name: Verify formatting
        run: dotnet format B2.NoMaui.slnf --verify-no-changes --no-restore

      - name: Build (Release; TreatWarningsAsErrors=true)
        run: dotnet build B2.NoMaui.slnf -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Test (Release)
        run: dotnet test B2.NoMaui.slnf -c Release --no-build
